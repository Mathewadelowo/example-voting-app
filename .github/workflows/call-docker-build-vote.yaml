name: Build, Test, Scan, and Deploy Vote Service
on:
  push:
    branches:
      - main
    paths:
      - "vote/**"
      - "helm/**"
      - ".github/workflows/call-docker-build-vote.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "vote/**"
      - "helm/**"
      - ".github/workflows/call-docker-build-vote.yaml"

jobs:
  automated-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint ./helm/voting-app

        
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Vote source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./vote
          ignore-unfixed: true
          scanners: misconfig,vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-and-push:
    runs-on: ubuntu-latest
    needs: trivy-scan
    env:
        IMAGE: ${{ secrets.DOCKER_USERNAME }}/voting-app-result:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 


      - name: Build and push Vote image
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          file: ./vote/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Trivy scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          scanners: misconfig,vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{env.IMAGE}}