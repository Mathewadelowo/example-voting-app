name: Build, Test, Scan, and Deploy Result Service

on:
  push:
    branches:
      - main
    paths:
      - "result/**"
      - "helm/**"
      - ".github/workflows/call-docker-build-result.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "result/**"
      - "helm/**"
      - ".github/workflows/call-docker-build-result.yaml"


jobs:
  automated-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint ./helm/voting-app

      - name: Container integration test
        run: |
          docker compose -f result/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut
        
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Result source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./result
          ignore-unfixed: true
          scanners: misconfig,vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-and-push:
    runs-on: ubuntu-latest
    needs: trivy-scan
    env:
        IMAGE: ${{ secrets.DOCKER_USERNAME }}/voting-app-result:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
            context: ./result
            load: true
            push: false
            tags: ${{env.IMAGE}}

      - name: Trivy scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
            scan-type: 'image' 
            image-ref: '${{env.IMAGE}}'
            format: 'table'
            ignore-unfixed: true
            severity: 'CRITICAL,HIGH'
            exit-code: "0"


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}
 
      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{env.IMAGE}}

  deploy-to-eks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    uses: ./.github/workflows/deploy-to-eks.yaml
    with:
      service: result
      image_tag: ${{ github.sha }}
    secrets: inherit