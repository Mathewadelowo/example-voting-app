name: Test, Scan and Build Workflow

on: 

  push:
    branches:
      - 'main'
    paths:
      - 'result/**'
      - '.github/workflows/call-docker-build-result.yaml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'result/**'
      - '.github/workflows/call-docker-build-result.yaml'

jobs:
  call-test:
    name: Run Integration Test
    runs-on: ubuntu-latest
    steps:

     - name: Checkout code
       uses: actions/checkout@v4
        
     - name: Run Result Integration Tests
       run: |
         docker compose -f result/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut
  
  code-scan:
    name: Run Trivy vulnerability scanner in ./result directory
    runs-on: ubuntu-latest
    needs: call-test
    permissions:
      contents: read
      security-events: write
    steps:

     - name: Checkout code
       uses: actions/checkout@v4
        
     - name: Run Trivy vulnerability scanner in repo
       uses: aquasecurity/trivy-action@v0.36.0
       with:
        scan-type: fs
        scan-ref: ./result
        scanners: vuln,secret,misconfig
        ignore-unfixed: true
        severity: CRITICAL,HIGH
        exit-code: '1'

     - name: Upload Trivy scan results to GitHub Security tab
       uses: github/codeql-action/upload-sarif@v4
       with:
        sarif_file: 'trivy-results.sarif'


         
