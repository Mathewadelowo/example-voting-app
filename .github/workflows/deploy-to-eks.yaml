name: Deploy to EKS

on:
  workflow_call:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: string
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true
      DOCKER_USERNAME:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Prevent concurrent upgrades of the same Helm release.
    concurrency:
      group: voting-app-eks-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Validate Helm chart
        run: helm lint ./helm/voting-app

      - name: Deploy service
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail

          case "$SERVICE" in
            vote)
              IMAGE_REPOSITORY="${DOCKER_USERNAME}/voting-app-vote"
              DEPLOYMENT_NAME="votes"
              ;;
            result)
              IMAGE_REPOSITORY="${DOCKER_USERNAME}/voting-app-result"
              DEPLOYMENT_NAME="result"
              ;;
            worker)
              IMAGE_REPOSITORY="${DOCKER_USERNAME}/voting-app-worker"
              DEPLOYMENT_NAME="worker"
              ;;

            test-bad-release)
            SERVICE="vote"
            IMAGE_REPOSITORY="${DOCKER_USERNAME}/voting-app-vote"
            DEPLOYMENT_NAME="votes"
            IMAGE_TAG="bad-tag-999999"
            ;;
            *)
              echo "Unsupported service: $SERVICE"
              exit 1
              ;;
          esac

          helm upgrade --install voting-app ./helm/voting-app \
            --namespace voting-app \
            --create-namespace \
            --reuse-values \
            --set "${SERVICE}.image.repository=${IMAGE_REPOSITORY}" \
            --set-string "${SERVICE}.image.tag=${IMAGE_TAG}" \
            --wait \
            --timeout 5m

          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" \
            --namespace voting-app \
            --timeout=180s

          helm status voting-app --namespace voting-app
          kubectl get deployments,pods,services --namespace voting-app